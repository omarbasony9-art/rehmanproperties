name = "rehman-inc"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist/public"

# ============================================================
# Cloudflare D1 Database
# ============================================================
# 1. Create:  wrangler d1 create rehman-inc-db
# 2. Paste the database_id returned above into this file
# 3. Apply schema: wrangler d1 execute rehman-inc-db --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "rehman-inc-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ============================================================
# Cloudflare R2 Object Storage (property photos)
# ============================================================
# Create bucket: wrangler r2 bucket create rehman-inc-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "rehman-inc-photos"

# ============================================================
# Environment Variables (non-secret)
# ============================================================
[vars]
ENVIRONMENT = "production"

# ============================================================
# Secrets — set with wrangler secret put <NAME>
# ============================================================
# wrangler secret put RESEND_API_KEY
# wrangler secret put RESEND_FROM_EMAIL
# wrangler secret put INQUIRY_NOTIFICATION_EMAIL
# wrangler secret put SESSION_SECRET
# wrangler secret put ADMIN_PASSWORD

# ============================================================
# Local Development
# ============================================================
[dev]
port = 8788
local_protocol = "http"
